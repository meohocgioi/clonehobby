<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sổ Tiết Kiệm</title>
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiết Kiệm">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <main id="view"></main>
  <button id="fab" class="fab" aria-label="Thêm sổ">+</button>
  <nav class="tabs" id="tabs">
    <button data-tab="all"><span class="ti">◎</span>Tổng quan</button>
    <button data-tab="vo"><span class="ti">♀</span><span class="nm">Vợ</span></button>
    <button data-tab="chong"><span class="ti">♂</span><span class="nm">Chồng</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
