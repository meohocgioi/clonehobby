name: Build downloadable apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: TpClone-Windows, sep: ";"}
          - {os: macos-latest,   name: TpClone-Mac,     sep: ":"}
          - {os: ubuntu-latest,  name: TpClone-Linux,   sep: ":"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt playwright pyinstaller
      - run: pyinstaller --onefile --name TpClone --collect-all playwright --add-data "tpclone/dashboard.html${{ matrix.sep }}tpclone" run_app.py
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: dist/*}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: dist/*}
